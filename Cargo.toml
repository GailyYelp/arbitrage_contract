
[package]
name = "arbitrage_contract"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "arbitrage_contract"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
default = []
# 网络与校验灵活性特性
# devnet: 使用 devnet 固定地址（如 Raydium CPMM authority），其余保持与客户端传入一致
devnet = []
flex = []
idl-build = ["anchor-lang/idl-build"]

[profile.release]
overflow-checks = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("anchor-debug", "cpi", "custom-heap", "custom-panic"))',
    'cfg(target_os, values("solana"))',
] }

[dependencies]
anchor-lang = "=0.31.1"
anchor-spl = "=0.31.1"

[build-dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"

[dev-dependencies]
serde_json = "1.0.143"
